<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parallax — moral-foundations mirror</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #e8eaed; --muted: #9aa0aa;
    --line: #2a2f3a; --self: #4c9be8; --other: #e8894c; --warn: #3a2f1a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --panel:#fff; --ink:#1a1d24; --muted:#5c6270;
            --line:#e2e5ea; --self:#2f6fb0; --other:#c46a2e; --warn:#fdf3e2; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing:-0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing:.06em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .jsd { text-align:center; }
  .jsd .num { font-size: 52px; font-weight: 700; letter-spacing:-0.02em; }
  .jsd .scale { color: var(--muted); font-size: 12px; }
  .legend { display:flex; gap:16px; justify-content:center; margin-top:6px; font-size:13px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .cards { margin-top: 18px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
  .card .meta { color: var(--muted); font-size:12px; margin-bottom:8px; }
  .card p { margin: 0 0 10px; }
  .exec { margin-top:18px; }
  .exec p { margin:0 0 10px; max-width: 68ch; }
  .exec p:last-child { margin-bottom:0; }
  .card p:last-child { margin-bottom:0; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--line); color:var(--muted); vertical-align:middle; margin-left:8px; }
  .caveat { margin-top:22px; background:var(--warn); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; font-size:13px; color:var(--ink); }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
  text { fill: var(--muted); }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Parallax <span id="method-badge"></span></h1>
  <p class="sub" id="subtitle">A moral-foundations mirror for two media diets.</p>
  <div id="app"></div>
</div>

<!-- Generated by `python -m dashboard.export` -->
<script src="./public/data/latest.js" onerror="window.__noData=true"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const D = window.PARALLAX_DATA;
const app = document.getElementById("app");

if (!D || window.__noData) {
  app.innerHTML = `<div class="empty">No data yet.<br><br>
    Run <code>python -m ingestion run</code>, then
    <code>python -m summarize</code>, then
    <code>python -m dashboard.export</code>,<br>and reload
    (serve with <code>python -m http.server</code> from <code>dashboard/</code>).</div>`;
} else {
  render(D);
}

function render(d) {
  document.getElementById("subtitle").textContent =
    `Generated ${new Date(d.generated_utc).toLocaleString()} · ${d.foundations.length} classic foundations`;
  if (d.summary_method) {
    const b = document.getElementById("method-badge");
    b.className = "badge"; b.textContent = d.summary_method === "claude" ? "Claude summary" : "numbers-only summary";
  }
  const colors = {}; const c = ["--self", "--other", "--muted"];
  d.diets.forEach((di, i) => colors[di.id] = getComputedStyle(document.documentElement).getPropertyValue(c[i] || "--muted").trim());

  const top = document.createElement("div"); top.className = "grid"; app.appendChild(top);

  // JSD panel
  const jp = panel(top, "Divergence");
  if (d.comparison) {
    jp.innerHTML += `<div class="jsd"><div class="num">${d.comparison.jsd.toFixed(3)}</div>
      <div class="scale">Jensen–Shannon · 0 = identical emphasis, 1 = disjoint</div></div>`;
  } else { jp.innerHTML += `<p class="sub">Need two scored diets to compare.</p>`; }
  const leg = document.createElement("div"); leg.className = "legend";
  d.diets.forEach(di => leg.innerHTML += `<span><i class="dot" style="background:${colors[di.id]}"></i>${dietName(di)} · ${di.doc_count}</span>`);
  jp.appendChild(leg);

  // Radar panel
  const rp = panel(top, "Foundation emphasis (composition)");
  radar(rp, d.foundations, d.diets, colors);
  if (d.has_confidence_bands) {
    const cap = document.createElement("div"); cap.className = "sub";
    cap.style.marginTop = "8px"; cap.style.fontSize = "12px";
    cap.innerHTML = "Whiskers = dictionary vs transformer range · wider = more disagreement (lower confidence). " +
      "Dot = ensemble point.";
    rp.appendChild(cap);
  }

  // The sentence that says what the number above means, before the evidence
  // for it. Same placement as the email.
  execSummary(app, d);

  // JSD over time
  jsdSeries(app, d);

  // Equality vs proportionality (MFQ-2)
  fairnessSplit(app, d, colors);

  // Liberty / oppression (Claude tagger)
  liberty(app, d, colors);

  // Diverging bars (log-ratios)
  if (d.comparison) {
    const bp = panel(app, `Over / under-indexing — ${named(d, d.comparison.pair[0])} vs ${named(d, d.comparison.pair[1])} (log-ratio)`);
    bp.style.marginTop = "18px";
    bars(bp, d.foundations, d.comparison.log_ratios, colors[d.comparison.pair[0]]);
  }

  // Summary cards
  if (d.diets.some(x => x.summary)) {
    const cards = document.createElement("div"); cards.className = "cards"; app.appendChild(cards);
    d.diets.forEach(di => {
      const card = panel(cards, dietName(di));
      card.className = "panel card";
      card.innerHTML += `<div class="meta">${di.doc_count} stories</div>` + paragraphs(di.summary || "—");
    });
  }
  blindspots(app, d, colors);

  const cav = document.createElement("div"); cav.className = "caveat";
  cav.textContent = "⚠︎ " + d.caveat; app.appendChild(cav);
}

// Divergence over time. Two series off the same snapshots, because they answer
// different questions: the trailing window can actually respond to a week of
// coverage, while the all-time line is the one the headline number reports and
// is heavily damped by every article ever ingested. Neither is the truer number.
function jsdSeries(app, d) {
  const hist = (d.history || []).filter(s => s.jsd_window !== null || s.jsd_cumulative !== null);
  const p = panel(app, "Divergence over time");
  p.style.marginTop = "18px";
  if (hist.length < 2) {
    p.innerHTML += `<p class="sub">Not enough history yet — every <code>python -m daily</code> run
      records one dated point. To fill in past days from publication dates already in the store:
      <code>python -m compare.history --backfill 30</code>.</p>`;
    return;
  }

  const wd = d.history_window_days || 7;
  const W = 900, H = 250, m = { t: 12, r: 18, b: 28, l: 46 };
  const pts = hist.map(s => ({
    date: new Date(s.date + "T00:00:00Z"), label: s.date, src: s.source,
    win: s.jsd_window, cum: s.jsd_cumulative,
  }));
  const maxY = Math.max(0.05, d3.max(pts, q => Math.max(q.win || 0, q.cum || 0)));
  const x = d3.scaleUtc().domain(d3.extent(pts, q => q.date)).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([0, maxY * 1.15]).nice().range([H - m.b, m.t]);
  const svg = d3.select(p).append("svg").attr("viewBox", `0 0 ${W} ${H}`);

  // Reconstructed days sit behind the first live run: same arithmetic, but a
  // corpus that has since been backfilled. Shade them rather than pretend the
  // whole line was observed as it happened.
  const firstLive = pts.findIndex(q => q.src === "live");
  if (firstLive > 0) {
    const edge = x(pts[firstLive].date);
    svg.append("rect").attr("x", x(pts[0].date)).attr("y", m.t)
      .attr("width", Math.max(0, edge - x(pts[0].date)))
      .attr("height", H - m.b - m.t).attr("fill", "var(--line)").attr("fill-opacity", 0.9);
    svg.append("line").attr("x1", edge).attr("x2", edge).attr("y1", m.t).attr("y2", H - m.b)
      .attr("stroke", "var(--muted)").attr("stroke-dasharray", "2 3");
    svg.append("text").attr("x", x(pts[0].date) + 8).attr("y", m.t + 13)
      .attr("font-size", 10).text("← reconstructed from stored dates");
    svg.append("text").attr("x", edge + 8).attr("y", m.t + 13)
      .attr("font-size", 10).text("recorded live →");
  }

  y.ticks(4).forEach(t => {
    svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(t)).attr("y2", y(t))
      .attr("stroke", "var(--line)");
    svg.append("text").attr("x", m.l - 8).attr("y", y(t)).attr("text-anchor", "end")
      .attr("dominant-baseline", "middle").attr("font-size", 11).text(t.toFixed(2));
  });
  x.ticks(Math.min(6, pts.length)).forEach(t => {
    svg.append("text").attr("x", x(t)).attr("y", H - 10).attr("text-anchor", "middle")
      .attr("font-size", 11).text(d3.utcFormat("%b %-d")(t));
  });

  const line = key => d3.line().defined(q => q[key] !== null && q[key] !== undefined)
    .x(q => x(q.date)).y(q => y(q[key]));
  svg.append("path").datum(pts).attr("fill", "none").attr("stroke", "var(--muted)")
    .attr("stroke-width", 1.5).attr("stroke-dasharray", "4 3").attr("d", line("cum"));
  svg.append("path").datum(pts).attr("fill", "none").attr("stroke", "var(--ink)")
    .attr("stroke-width", 2).attr("d", line("win"));

  // Hover readout: a guide line plus exact values, so the chart is legible
  // without asking anyone to eyeball a pixel against an axis.
  const guide = svg.append("line").attr("y1", m.t).attr("y2", H - m.b)
    .attr("stroke", "var(--muted)").attr("stroke-width", 1).attr("opacity", 0);
  const dotW = svg.append("circle").attr("r", 3.5).attr("fill", "var(--ink)").attr("opacity", 0);
  const dotC = svg.append("circle").attr("r", 3).attr("fill", "var(--muted)").attr("opacity", 0);
  const out = document.createElement("div");
  out.className = "sub"; out.style.margin = "4px 0 0"; out.style.minHeight = "18px";
  const latest = pts[pts.length - 1];
  const fmt = q => `<b>${q.label}</b> · ${wd}-day ${q.win === null ? "—" : q.win.toFixed(3)} ·
    all-time ${q.cum === null ? "—" : q.cum.toFixed(3)}${q.src === "reconstructed" ? " · reconstructed" : ""}`;
  out.innerHTML = fmt(latest);
  p.appendChild(out);

  const bisect = d3.bisector(q => q.date).center;
  svg.append("rect").attr("x", m.l).attr("y", m.t).attr("width", W - m.r - m.l)
    .attr("height", H - m.b - m.t).attr("fill", "transparent")
    .on("pointermove", function (ev) {
      const q = pts[bisect(pts, x.invert(d3.pointer(ev, this)[0] + m.l))];
      if (!q) return;
      guide.attr("x1", x(q.date)).attr("x2", x(q.date)).attr("opacity", 0.5);
      dotW.attr("cx", x(q.date)).attr("cy", y(q.win || 0)).attr("opacity", q.win === null ? 0 : 1);
      dotC.attr("cx", x(q.date)).attr("cy", y(q.cum || 0)).attr("opacity", q.cum === null ? 0 : 1);
      out.innerHTML = fmt(q);
    })
    .on("pointerleave", () => {
      guide.attr("opacity", 0); dotW.attr("opacity", 0); dotC.attr("opacity", 0);
      out.innerHTML = fmt(latest);
    });

  const cap = document.createElement("div");
  cap.className = "sub"; cap.style.marginTop = "6px"; cap.style.fontSize = "12px";
  cap.innerHTML = `<span style="border-bottom:2px solid var(--ink)">solid</span> = trailing ${wd} days,
    the basis that can respond to an event ·
    <span style="border-bottom:2px dashed var(--muted)">dashed</span> = all-time, the headline number,
    damped by the whole corpus. Both are the same noisy estimates the radar shows — read movement,
    not decimals.`;
  p.appendChild(cap);
}

// Equality vs proportionality — the MFQ-2 split of fairness. The radar reports
// fairness as one number, which can make two diets look similar exactly where
// they disagree: both talk about fairness constantly and mean different things.
// Shares are *within* fairness, so a diet that writes more doesn't read as
// caring more about either half.
function fairnessSplit(app, d, colors) {
  const fs = d.fairness_split;
  const p = panel(app, "Fairness — equality vs proportionality");
  p.style.marginTop = "18px";
  if (!fs || !fs.diets) {
    p.innerHTML += `<p class="sub">No documents carried enough evidence to split fairness.
      This is unvalidated and off by default in spirit — see <code>scoring/fairness_split.py</code>.</p>`;
    return;
  }

  const W = 900, rowH = 54, ids = Object.keys(fs.diets).sort();
  const H = ids.length * rowH + 34;
  const L = 150, R = 60;
  const svg = d3.select(p).append("svg").attr("viewBox", `0 0 ${W} ${H}`);
  const x = d3.scaleLinear().domain([0, 1]).range([L, W - R]);

  // Midline: an even split. Reading distance from it is the whole point.
  svg.append("line").attr("x1", x(0.5)).attr("x2", x(0.5)).attr("y1", 18).attr("y2", H - 20)
    .attr("stroke", "var(--muted)").attr("stroke-dasharray", "2 3");
  svg.append("text").attr("x", x(0.5)).attr("y", 12).attr("text-anchor", "middle")
    .attr("font-size", 10).text("even");
  svg.append("text").attr("x", L).attr("y", 12).attr("font-size", 11).text("← equality");
  svg.append("text").attr("x", W - R).attr("y", 12).attr("text-anchor", "end")
    .attr("font-size", 11).text("proportionality →");

  ids.forEach((id, i) => {
    const v = fs.diets[id], y = 30 + i * rowH, h = 22;
    const eqW = Math.max(0, x(v.equality) - x(0));
    // Thin coverage is drawn thin: hatch-free but faded, with the count adjacent.
    const op = v.thin ? 0.28 : 0.85;
    svg.append("rect").attr("x", x(0)).attr("y", y).attr("width", eqW).attr("height", h)
      .attr("fill", colors[id] || "var(--muted)").attr("fill-opacity", op)
      .attr("rx", 3);
    svg.append("rect").attr("x", x(v.equality)).attr("y", y)
      .attr("width", Math.max(0, x(1) - x(v.equality))).attr("height", h)
      .attr("fill", colors[id] || "var(--muted)").attr("fill-opacity", op * 0.3)
      .attr("rx", 3);
    svg.append("text").attr("x", L - 10).attr("y", y + h / 2).attr("text-anchor", "end")
      .attr("dominant-baseline", "middle").attr("font-size", 12).attr("fill", "var(--ink)")
      .text(id);
    if (v.equality > 0.08) {
      svg.append("text").attr("x", x(0) + 8).attr("y", y + h / 2)
        .attr("dominant-baseline", "middle").attr("font-size", 11).attr("fill", "var(--ink)")
        .text(`${Math.round(v.equality * 100)}%`);
    }
    if (v.proportionality > 0.08) {
      svg.append("text").attr("x", x(1) - 8).attr("y", y + h / 2).attr("text-anchor", "end")
        .attr("dominant-baseline", "middle").attr("font-size", 11).attr("fill", "var(--ink)")
        .text(`${Math.round(v.proportionality * 100)}%`);
    }
    svg.append("text").attr("x", L).attr("y", y + h + 13).attr("font-size", 10)
      .text(`${v.docs_split} of ${v.docs_total} documents split (${Math.round(v.coverage * 100)}%)`
            + (v.thin ? " — too thin to read" : ""));
  });

  const cap = document.createElement("div");
  cap.className = "sub"; cap.style.marginTop = "8px"; cap.style.fontSize = "12px";
  const g = fs.gap;
  const thinNote = g && g.thin ? ", on coverage too thin to rely on" : "";
  const lead = g
    ? `<b>${g.pair[0]}</b> leans ${g.equality_gap >= 0 ? "more" : "less"} on equality than `
      + `<b>${g.pair[1]}</b> by ${Math.abs(Math.round(g.equality_gap * 100))} points`
      + `${thinNote}. `
    : "";
  cap.innerHTML = lead +
    `Theory predicts equality on the left and proportionality on the right — that is the
     hypothesis being tested here, not an assumption baked in. Treat a match as weak evidence:
     the partition uses a hand-built term list with no validation behind it, the
     liberal/conservative asymmetry replicates poorly when measured in language specifically,
     and proportionality is reported to bridge the divide rather than mark it.`;
  p.appendChild(cap);
}

// Liberty / oppression — the sixth foundation, scored by Claude because no
// dictionary or available transformer covers it. Shown as an absolute mean
// rather than a radar spoke: it is scored on a subset of documents, and folding
// partial coverage into the five-way composition would move every other share
// (and the headline divergence) as a side effect of coverage.
function liberty(app, d, colors) {
  const lib = d.liberty;
  const p = panel(app, "Liberty / oppression");
  p.style.marginTop = "18px";
  if (!lib || !lib.diets) {
    p.innerHTML += `<p class="sub">Not scored. The liberty tagger runs at ingestion when
      <code>ANTHROPIC_API_KEY</code> is set — it is the one foundation no dictionary or
      transformer in this project covers.</p>`;
    return;
  }

  const ids = Object.keys(lib.diets).sort();
  const W = 900, rowH = 56, H = ids.length * rowH + 30, L = 150, R = 70;
  const maxMean = Math.max(0.25, d3.max(ids, id => lib.diets[id].mean) * 1.25);
  const x = d3.scaleLinear().domain([0, maxMean]).range([L, W - R]);
  const svg = d3.select(p).append("svg").attr("viewBox", `0 0 ${W} ${H}`);

  x.ticks(5).forEach(t => {
    svg.append("line").attr("x1", x(t)).attr("x2", x(t)).attr("y1", 16).attr("y2", H - 18)
      .attr("stroke", "var(--line)");
    svg.append("text").attr("x", x(t)).attr("y", 11).attr("text-anchor", "middle")
      .attr("font-size", 10).text(t.toFixed(2));
  });

  ids.forEach((id, i) => {
    const v = lib.diets[id], y = 28 + i * rowH, h = 20;
    svg.append("rect").attr("x", x(0)).attr("y", y)
      .attr("width", Math.max(0, x(v.mean) - x(0))).attr("height", h)
      .attr("fill", colors[id] || "var(--muted)")
      .attr("fill-opacity", v.thin ? 0.28 : 0.85).attr("rx", 3);
    svg.append("text").attr("x", L - 10).attr("y", y + h / 2).attr("text-anchor", "end")
      .attr("dominant-baseline", "middle").attr("font-size", 12).attr("fill", "var(--ink)")
      .text(id);
    svg.append("text").attr("x", x(v.mean) + 8).attr("y", y + h / 2)
      .attr("dominant-baseline", "middle").attr("font-size", 11).attr("fill", "var(--ink)")
      .text(v.mean.toFixed(3));
    svg.append("text").attr("x", L).attr("y", y + h + 14).attr("font-size", 10)
      .text(`${Math.round(v.salient_share * 100)}% of tagged stories score above 0.5 · `
            + `${v.docs_scored} of ${v.docs_total} tagged (${Math.round(v.coverage * 100)}%)`
            + (v.thin ? " — too thin to read" : ""));
  });

  const cap = document.createElement("div");
  cap.className = "sub"; cap.style.marginTop = "8px"; cap.style.fontSize = "12px";
  const g = lib.gap;
  const thinNote = g && g.thin ? ", on coverage too thin to rely on" : "";
  const lead = g
    ? `<b>${g.pair[0]}</b> engages liberty ${g.mean_gap >= 0 ? "more" : "less"} than `
      + `<b>${g.pair[1]}</b> by ${Math.abs(g.mean_gap).toFixed(3)}${thinNote}. `
    : "";
  cap.innerHTML = lead +
    `Mean presence per tagged story, 0 to 1. The rubric is deliberately conservative, so
     low means are expected — read the difference between diets, not the level. Liberty is
     claimed in both registers (freedom from state coercion, and freedom from private or
     structural domination) and the rubric is written to score both; that symmetry is the
     part most worth auditing. Scored by ${escapeHtml(lib.scorer)}, on documents ingested
     from feeds only, and kept off the radar because partial coverage cannot go into a
     composition without moving every other share.`;
  p.appendChild(cap);
}

// Blindspots, read by theme. A cluster is the unit the asymmetry is measured on
// and a couple of dozen c-TF-IDF labels is a readout, not a finding — so the
// page groups them. `blindspot_themes` is always populated alongside
// `blindspots` by the current exporter (an unthemed store falls back to the
// taxonomy server-side), but a `latest.js` written before theming existed has
// clusters and no themes. That payload still renders, as clusters: an old file
// on disk should look dated, not broken.
function blindspots(app, d, colors) {
  const themes = d.blindspot_themes || [];
  const bs = d.blindspots || [];
  const p = panel(app, "Blindspots — what each diet covers that the other doesn't");
  p.style.marginTop = "18px";
  if (!themes.length && !bs.length) {
    p.innerHTML += `<p class="sub">No blindspots yet. Run <code>python -m cluster run</code> to cluster stories and detect coverage asymmetry.</p>`;
    return;
  }
  const grid = document.createElement("div"); grid.className = "cards"; p.appendChild(grid);
  d.diets.forEach(di => {
    const col = document.createElement("div"); col.className = "panel card";
    col.style.background = "transparent"; col.style.borderStyle = "dashed";
    col.innerHTML = `<h2 style="color:${colors[di.id]}">${dietName(di)} covers · other misses</h2>`;
    const mine = (themes.length ? themes : bs).filter(x => x.dominant_diet === di.id);
    if (!mine.length) { col.innerHTML += `<p class="sub">— none —</p>`; }
    mine.forEach(x => themes.length ? themeCard(col, x, colors[di.id])
                                    : clusterEntry(col, x, colors[di.id]));
    grid.appendChild(col);
  });
  const named = themes.filter(t => t.method === "claude").length;
  const note = document.createElement("p"); note.className = "sub";
  note.style.marginTop = "10px";
  note.textContent = (themes.length
      ? `${themes.length} ${themes.length === 1 ? "theme" : "themes"} over ${bs.length} ${bs.length === 1 ? "cluster" : "clusters"}. ` +
        (named ? "Theme names by Claude, from the headlines in each cluster. " :
                 "Theme names from the built-in taxonomy (cluster/themes.py). ")
      : `${bs.length} ${bs.length === 1 ? "cluster" : "clusters"}, ungrouped — this payload predates theming. ` +
        "Re-run `python -m cluster run` to read them by theme. ") +
    "Coverage asymmetry is not a judgement about which story mattered more.";
  p.appendChild(note);
}

// One theme: the name a person would use, the counts, and its headlines.
function themeCard(col, t, colour) {
  const stories = (t.stories || []).map(s => `<li>${escapeHtml(s)}</li>`).join("");
  const rest = (t.story_count || 0) - (t.stories || []).length;
  col.innerHTML += `<div style="margin-bottom:14px; border-left:3px solid ${colour}; padding-left:10px">
    <div style="font-weight:600">${escapeHtml(t.title)}</div>
    <div class="sub">${t.story_count} ${t.story_count === 1 ? "story" : "stories"} · ${t.cluster_count} ${t.cluster_count === 1 ? "cluster" : "clusters"} · ${Math.round((t.one_sided||0)*100)}% one-sided</div>
    <ul style="margin:6px 0 0; padding-left:18px; color:var(--muted); font-size:13px">${stories}</ul>
    ${rest > 0 ? `<div class="sub" style="margin-top:4px">+${rest} more</div>` : ""}
  </div>`;
}

// One cluster under its c-TF-IDF label — only for a payload written before
// theming existed. Kept because it is what that payload can honestly show.
function clusterEntry(col, b, colour) {
  const rep = (b.representative_titles || []).map(t => `<li>${escapeHtml(t)}</li>`).join("");
  col.innerHTML += `<div style="margin-bottom:12px; border-left:3px solid ${colour}; padding-left:10px">
    <div style="font-weight:600">${escapeHtml(b.label || "(untitled cluster)")}</div>
    <div class="sub">${b.size} ${b.size === 1 ? "story" : "stories"} · ${Math.round((b.dominant_share||0)*100)}% one-sided</div>
    <ul style="margin:6px 0 0; padding-left:18px; color:var(--muted); font-size:13px">${rep}</ul>
  </div>`;
}

function panel(parent, title) {
  const p = document.createElement("div"); p.className = "panel";
  p.innerHTML = `<h2>${title}</h2>`; parent.appendChild(p); return p;
}
// What a heading or legend calls a diet: the registry's short label, then its
// full one, then the machine id. The full label is written to read as a noun
// phrase inside a sentence ("Modeled conservative-evangelical diet"), which is
// right for the summaries and too long for a legend.
function dietName(di) { return escapeHtml(di.short_label || di.label || di.id); }
// The same name where only the id is at hand (the log-ratio heading), so one
// page does not call the same diet two things.
function named(d, id) {
  const di = (d.diets || []).find(x => x.id === id);
  return di ? dietName(di) : escapeHtml(id);
}

// Blank lines in the generated prose are paragraph breaks; a line break inside
// a paragraph is the model's wrap, not one the reader should see.
function paragraphs(text) {
  return text.split(/\n\s*\n/).map(b => b.split(/\s+/).join(" ").trim())
    .filter(Boolean).map(b => `<p>${escapeHtml(b)}</p>`).join("");
}

function execSummary(app, d) {
  const text = (d.executive_summary || "").trim();
  if (!text) return;
  const ep = panel(app, "The short version");
  ep.className = "panel exec";
  ep.innerHTML += paragraphs(text);
}
function escapeHtml(s) { const e = document.createElement("div"); e.textContent = s; return e.innerHTML; }

// The value plotted per foundation: the ensemble point when a band exists,
// else the dictionary composition. Returns {v, low, high} (low/high null = no band).
function radarValue(di, f) {
  const b = di.band && di.band[f];
  if (b) return { v: b.point, low: b.low, high: b.high };
  return { v: di.profile[f] || 0, low: null, high: null };
}

function radar(el, foundations, diets, colors) {
  const size = 320, r = size/2 - 46, cx = size/2, cy = size/2, N = foundations.length;
  // Scale to the largest plotted value, band highs included, so whiskers fit.
  const maxVal = Math.max(0.001, d3.max(diets, di => d3.max(foundations, f => {
    const rv = radarValue(di, f); return Math.max(rv.v, rv.high || 0);
  })));
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${size} ${size}`);
  const angle = i => (Math.PI * 2 * i / N) - Math.PI/2;
  const pt = (i, v) => [cx + Math.cos(angle(i)) * r * (v/maxVal), cy + Math.sin(angle(i)) * r * (v/maxVal)];

  [0.25, 0.5, 0.75, 1].forEach(g => {
    svg.append("polygon").attr("points", foundations.map((_, i) =>
      (cx + Math.cos(angle(i))*r*g) + "," + (cy + Math.sin(angle(i))*r*g)).join(" "))
      .attr("fill", "none").attr("stroke", "var(--line)");
  });
  foundations.forEach((f, i) => {
    const [ex, ey] = [cx + Math.cos(angle(i))*r, cy + Math.sin(angle(i))*r];
    svg.append("line").attr("x1", cx).attr("y1", cy).attr("x2", ex).attr("y2", ey).attr("stroke", "var(--line)");
    const lx = cx + Math.cos(angle(i))*(r+22), ly = cy + Math.sin(angle(i))*(r+22);
    svg.append("text").attr("x", lx).attr("y", ly).attr("text-anchor", "middle")
      .attr("dominant-baseline", "middle").attr("font-size", 11).text(f);
  });
  diets.forEach(di => {
    const rvs = foundations.map((f, i) => ({ i, ...radarValue(di, f) }));
    const pts = rvs.map(rv => pt(rv.i, rv.v));
    svg.append("polygon").attr("points", pts.map(p => p.join(",")).join(" "))
      .attr("fill", colors[di.id]).attr("fill-opacity", 0.18)
      .attr("stroke", colors[di.id]).attr("stroke-width", 2);
    // Confidence whiskers: a radial segment from low to high on each axis.
    rvs.forEach(rv => {
      if (rv.low === null || rv.high <= rv.low) return;
      const [x1, y1] = pt(rv.i, rv.low), [x2, y2] = pt(rv.i, rv.high);
      svg.append("line").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2)
        .attr("stroke", colors[di.id]).attr("stroke-width", 3).attr("stroke-opacity", 0.5)
        .attr("stroke-linecap", "round");
    });
    pts.forEach(p => svg.append("circle").attr("cx", p[0]).attr("cy", p[1]).attr("r", 2.5).attr("fill", colors[di.id]));
  });
}

function bars(el, foundations, ratios, color) {
  const w = 900, rowH = 34, h = foundations.length * rowH + 20, cx = w/2;
  const vals = foundations.map(f => ratios[f] || 0);
  const maxAbs = Math.max(0.3, d3.max(vals, Math.abs));
  // Leave room at both ends for the value labels, which sit outside the bar —
  // at range [20, w-20] the widest bar pushed its own label off the viewBox.
  const x = d3.scaleLinear().domain([-maxAbs, maxAbs]).range([70, w-70]);
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
  svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", 6).attr("y2", h-14).attr("stroke", "var(--line)");
  foundations.forEach((f, i) => {
    const v = ratios[f] || 0, y = 10 + i*rowH;
    svg.append("rect").attr("x", Math.min(x(0), x(v))).attr("y", y).attr("height", rowH-14)
      .attr("width", Math.abs(x(v)-x(0))).attr("fill", color).attr("fill-opacity", v>=0?0.8:0.35).attr("rx", 3);
    svg.append("text").attr("x", v>=0 ? x(0)-8 : x(0)+8).attr("y", y+(rowH-14)/2)
      .attr("text-anchor", v>=0?"end":"start").attr("dominant-baseline", "middle").attr("font-size", 12).text(f);
    svg.append("text").attr("x", v>=0 ? x(v)+6 : x(v)-6).attr("y", y+(rowH-14)/2)
      .attr("text-anchor", v>=0?"start":"end").attr("dominant-baseline", "middle")
      .attr("font-size", 11).attr("fill", "var(--ink)").text(v.toFixed(2));
  });
}
</script>
