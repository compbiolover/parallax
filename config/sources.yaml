  - id: self_yt_paulogia
    name: "Paulogia"
    medium: youtube
    stratum: youtube
    role: "ex-Christian apologetics criticism"
    ingest:
      type: youtube
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCC0_0zNfnHBNi50okydMGkw"
    # The one source here that speaks directly to the other family's
    # subject matter, which makes it the most likely to produce
    # same-story clusters rather than a blindspot in one direction.
    rationale: "Addresses evangelical claims directly; sanctity and authority discourse from the outside."
  - id: self_yt_frontline
    name: "FRONTLINE PBS"
    medium: youtube
    stratum: youtube
    role: "documentary journalism"
    ingest:
      type: youtube
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCdsOGt7RU-E_u7gPKsFoSqQ"
    rationale: "Feature-length investigation; care/harm framing at a length no daily reaches."
    terms: >
      Captions first (youtube-transcript-api), audio fallback. Summarize
      and link only — never republish transcript text.

# =============================================================================
# PERSONAS
# =============================================================================
personas:

  # ---------------------------------------------------------------------------
  # `self` — the author's own diet, and one half of the default reference pair.
  #
  # This is an editable model: tune the weights to your real attention. Because
  # the pipeline is symmetric, this persona's foundation skew and blindspots are
  # surfaced with equal prominence to any other.
  #
  # The weights below are unchanged from registry version 2, where they were
  # `stratum_weight * source weight` inside a nested `self` diet. Both `podcasts`
  # and `youtube` carry 0.10 because version 2 held them in ONE stratum weighted
  # 0.10; splitting that stratum while halving the number would have quietly
  # halved every audio and video source. Only relative weights matter, so
  # repeating the multiplier is exactly weight-preserving — which is what keeps
  # the recorded divergence series continuous across the version bump.
  # ---------------------------------------------------------------------------
  - id: self
    label: "My diet"
    short_label: "My diet"
    family: left
    description: >
      A model of the author's own media consumption: mainstream / center-left
      national news, public broadcasting, and long-form magazines. Weights are a
      first draft — adjust to reflect actual attention. Because the pipeline is
      symmetric, this diet's foundation skew and blindspots are reported as
      prominently as any modeled persona's.
    strata:
      national_dailies: 0.36
      public_broadcast: 0.31
      long_form: 0.23
      # Audio and video: the least syndicated, least filtered part of the diet,
      # and the part a text-only pipeline cannot see at all. Weighted at 0.10
      # deliberately — this is listening the author is taking up rather than
      # listening already established, and CLAUDE.md §5 says model what is
      # consumed, not what is intended. An aspirational weight would inflate a
      # slice of the diet that is not being consumed yet, and it would do so on
      # the side of the comparison where the author is least likely to notice.
      # Raise it once the habit is real; it is the single easiest number in this
      # file to check against your own week.
      podcasts: 0.10
      youtube: 0.10
    # The membership list. Nothing outside it reaches this persona — including
    # the conservative-evangelical outlets, which are absent because they are
    # unlisted rather than because they were forgotten.
    sources:
      self_nyt_home: 1.0
      self_wapo_national: 0.9
      self_guardian_us: 0.8
      self_politico_picks: 0.7
      self_ap_topnews: 0.7
      self_npr_news: 1.0
      self_npr_politics: 0.7
      self_pbs_newshour: 0.7
      self_bbc_world: 0.8
      self_atlantic: 1.0
      self_vox: 0.8
      self_goodgood: 0.5
      self_npr_upfirst: 1.0
      self_pbs_newshour_show: 0.7
      self_nyt_daily: 0.9
