# =============================================================================
# Parallax source registry
# =============================================================================
# THE source model for every media diet Parallax compares. This file is the
# single source of truth for what Parallax ingests, and it is versioned
# deliberately: every conclusion the tool draws should be reproducible against a
# specific version of this registry, and sensitivity-tested against the
# weighting choices below.
#
# GUARDRAILS (see CLAUDE.md §0):
#   - Every persona here is a documented model of OUTLETS AND PROGRAMS, not any
#     real individual's consumption. No private communications, ever.
#   - A persona is a weighting over sources. It is not a person, and nothing
#     downstream may describe it as one.
#   - Model what is plausibly *consumed*, not merely what is *published*.
#     Distinguish outlet bias from audience consumption.
#   - Represent internal diversity; do not collapse a family to one voice.
#   - Honor robots.txt, rate limits, and each source's terms. Summarize and
#     link; never republish.
#   - Your OWN diet does not belong in this file. This one is public and
#     committed; a real person's real consumption goes in the gitignored
#     `config/personas.local.yaml`, which is merged over this file at load.
#
# =============================================================================
# SCHEMA (version 3)
# =============================================================================
# Sources and personas are separate. A source is a fact about a publisher; a
# persona is a fact about a reader. Keeping them apart is what lets several
# personas share one source: a passive cable viewer and a devout evangelical
# both watch Fox, and the catalog holds Fox exactly once. Every source is then
# fetched, scored, embedded, and tagged once no matter how many personas
# include it, so adding a persona costs nothing at runtime.
#
#   version        int    Bumped on any change to the source set or weights.
#   updated        date   ISO-8601 date of last change.
#
#   strata[]              The global vocabulary of medium/role groupings. Global
#                           because a stratum is a property of the source, not
#                           of whoever consumes it.
#     id           str    Stable stratum id, unique in this file.
#     description  str    What belongs in this stratum and why it is separated.
#
#   catalog[]             Every source, once. No source is owned by a persona.
#     id          str   Stable machine id, unique within the file. NEVER rename
#                         one: it is the join key for every stored document, so
#                         a rename orphans the corpus. The `self_` / `ce_`
#                         prefixes are historical — they record which persona
#                         first registered the source, not who may use it.
#     name        str   Display name.
#     medium      enum  news | cable | talk_radio | podcast | youtube | newsletter
#     stratum     str   Which stratum this source belongs to (one, required).
#     role        str   Editorial role this source plays.
#     ingest            How to pull it.
#       type      enum  rss | gdelt | mediacloud | podcast_rss | youtube
#       url       str   Feed / channel URL. null = TODO, verify before use.
#       url_env   str   Name of an environment variable holding the feed URL,
#                         for subscriber feeds whose URL is itself the
#                         credential (a per-account token in the path or
#                         query). Used when that variable is set and
#                         non-empty; `url` is the fallback otherwise, so an
#                         entry can carry the public feed and upgrade for
#                         whoever holds the subscription. The name goes here;
#                         the value goes in the environment (see .env.example
#                         and scripts/bitwarden.conf.example) and never in
#                         this file, which is public.
#     domain      str   Outlet domain for GDELT backfill, when it differs from
#                         the feed host or the feed URL is null.
#     rationale   str   Why this specific source, in one line. Required.
#     terms       str   Notes on robots.txt / ToS / rate limits if non-obvious.
#
#   personas[]            A weight profile over the catalog.
#     id           str   Stable machine id. Used as the diet key everywhere
#                          downstream, so renaming one breaks recorded history.
#     label        str   Human label, used in prose (summaries name the persona
#                          with it, so it should read as a noun phrase).
#     short_label  str   Optional short form for chart legends and panel
#                          headings, where the full label would wrap.
#                          Defaults to `label`.
#     family       str   Which side of the comparison this persona belongs to.
#                          Personas within a family are variants, not opponents.
#     description  str   What this persona models and how it was constructed.
#     strata            Map of stratum id -> weight. The medium-level multiplier:
#                          it says how much a whole medium counts for this
#                          reader, so per-source numbers stay small and
#                          comparable within a stratum.
#     sources           Map of source id -> weight within its stratum. This is
#                          also the MEMBERSHIP LIST: a persona consumes exactly
#                          the sources listed here and nothing else.
#
# Membership is opt-in, not inherited from the stratum, and that is deliberate.
# Strata are shared — `podcasts` holds both NPR's Up First and Relatable — so
# "every source in a weighted stratum" would hand every persona every other
# persona's podcasts. The alternative to opt-in is an exclusion list per persona
# that has to grow every time anyone adds a source, which is exactly the kind of
# quiet, load-bearing omission this file is written to avoid. Listing membership
# also means reading a persona tells you its entire diet.
#
# A source's effective weight is `strata[source.stratum] * sources[source.id]`.
# Only *relative* weights matter — aggregation divides by the total — so the
# absolute scale of these numbers carries no meaning on its own. Listing a source
# whose stratum this persona gives no weight is an error, not a silent zero.
#
# CAUTION, and it is a real one: `stratum_weight` is a per-source multiplier,
# NOT that stratum's share of the diet. Because strata hold different numbers of
# sources, a stratum weighted 0.10 across ten sources contributes far more total
# weight than one weighted 0.36 across two. `self`'s nominal 0.10 audio/video
# strata are really about 18% of its weight. Read these numbers as relative
# multipliers and check any conclusion against a re-weighting (CLAUDE.md §5).
#
# NOTE ON null URLs: a null `url` is an explicit TODO. Feed URLs must be
# verified live (they move) before the source is activated in ingestion.
# =============================================================================

version: 3
updated: 2026-08-10

# Foundations this registry's downstream scoring targets. Kept here for
# provenance; the scorer is the authority on the active label set.
foundations:
  - care/harm
  - fairness/cheating         # optionally split: equality vs proportionality
  - loyalty/betrayal
  - authority/subversion
  - sanctity/degradation
  - liberty/oppression        # Claude-tagged; not covered by dictionary baseline

# =============================================================================
# STRATA
# =============================================================================
strata:
  - id: national_dailies
    description: >
      National general-interest dailies — the backbone of a mainstream diet.
      Heavy syndication overlap across these and the wires; dedup matters.
  - id: public_broadcast
    description: >
      Public and broadcast news — measured, institutional framing that
      contrasts with the opinion-forward outlets in every family.
  - id: long_form
    description: >
      Long-form magazines and explainer outlets — where framing and moral
      argument are most explicit, so foundation signal is strongest here.
  - id: national_cable
    description: >
      National cable news and its opinion desks. A large share of conservative
      news attention, and the medium most likely to dominate a profile if
      over-weighted.
  - id: talk_radio
    description: >
      Talk radio and commentary audio. Under-measured by text-only tools yet
      central to conservative media diets. Ingested via audio feeds and
      transcribed (faster-whisper).
  - id: digital_outlets
    description: >
      Digital-native outlets spanning hard-news-adjacent to explicitly
      movement-aligned reporting. Captures written framing at scale.
  - id: faith_media
    description: >
      Explicitly evangelical/Christian news outlets. Central to the sanctity and
      loyalty framing this project studies; must not be omitted or collapsed
      into generic "conservative".
  - id: podcasts
    description: >
      Long-form podcast audio — the least syndicated, least filtered part of a
      diet, and invisible to a text-only pipeline.
  - id: youtube
    description: >
      Video programs, kept separate from podcasts because the ingest path is
      different: captions first (youtube-transcript-api), audio fallback.

# =============================================================================
# CATALOG — every source, once. Grouped by stratum for readability only;
# each entry's `stratum` field is what the loader reads.
# =============================================================================
catalog:

  # ---------------------------------------------------------------------------
  # national_dailies
  # Feed URLs verified live 2026-07-23 (HTTP 200, valid RSS/Atom) except where
  # a comment says otherwise.
  # ---------------------------------------------------------------------------
  - id: self_nyt_home
    name: "The New York Times — Home Page"
    medium: news
    stratum: national_dailies
    role: "national daily of record"
    ingest:
      type: rss
      url: "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"
    rationale: "Highest-attention national daily; broad agenda-setting coverage."
  - id: self_wapo_national
    name: "The Washington Post — National"
    medium: news
    stratum: national_dailies
    role: "national daily"
    ingest:
      type: rss
      url: "https://feeds.washingtonpost.com/rss/national"
    rationale: "Politics-heavy national coverage; strong care/fairness salience."
  - id: self_guardian_us
    name: "The Guardian — US"
    medium: news
    stratum: national_dailies
    role: "center-left national daily"
    ingest:
      type: rss
      url: "https://www.theguardian.com/us/rss"
    rationale: "Explicit center-left framing; pronounced care/fairness emphasis."
  - id: self_politico_picks
    name: "Politico — Picks"
    medium: news
    stratum: national_dailies
    role: "digital politics outlet"
    ingest:
      type: rss
      # Politico's flagship feed (feed index: https://www.politico.com/rss).
      # Genuine and long-standing, but Politico's edge returns 403 to
      # datacenter/bot IPs, so it could NOT be verified from CI on
      # 2026-07-23 — verify from a residential IP before relying on it.
      url: "https://www.politico.com/rss/politicopicks.xml"
    rationale: "Inside-DC politics framing; heavy authority/fairness salience."
  - id: self_ap_topnews
    name: "AP News — Top News"
    medium: news
    stratum: national_dailies
    role: "wire service"
    ingest:
      type: rss
      # AP dropped official RSS. The community project
      # https://github.com/rererecursive/associated-press-rss can
      # regenerate feeds, but its public S3 host now 404s (dead as of
      # 2026-07-23). Self-host that scraper and point this url at your
      # instance to activate. Left null so ingestion skips it until then.
      url: null
    # GDELT can still backfill AP historically by domain even without RSS.
    domain: apnews.com
    rationale: "Wire baseline; heavy syndication across the diet — dedup matters."

  # ---------------------------------------------------------------------------
  # public_broadcast
  # ---------------------------------------------------------------------------
  - id: self_npr_news
    name: "NPR — News"
    medium: news
    stratum: public_broadcast
    role: "public-radio national desk"
    ingest:
      type: rss
      url: "https://feeds.npr.org/1001/rss.xml"
    rationale: "Broad national coverage; public-radio framing."
  - id: self_npr_politics
    name: "NPR — Politics"
    medium: news
    stratum: public_broadcast
    role: "public-radio politics desk"
    ingest:
      type: rss
      url: "https://feeds.npr.org/1014/rss.xml"
    rationale: "Politics vertical; sharpens the authority/fairness signal."
  - id: self_pbs_newshour
    name: "PBS NewsHour"
    medium: news
    stratum: public_broadcast
    role: "public-television news"
    ingest:
      type: rss
      url: "https://www.pbs.org/newshour/feeds/rss/headlines"
    rationale: "Measured broadcast framing; long-form segments."
  - id: self_bbc_world
    name: "BBC News — World"
    medium: news
    stratum: public_broadcast
    role: "international broadcaster"
    ingest:
      type: rss
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    domain: bbc.com          # feed host is bbci.co.uk; articles live on bbc.com
    rationale: "Non-US vantage point; counterweight to domestic framing."

  # ---------------------------------------------------------------------------
  # long_form
  # ---------------------------------------------------------------------------
  - id: self_atlantic
    name: "The Atlantic"
    medium: news
    stratum: long_form
    role: "long-form magazine"
    ingest:
      type: rss
      url: "https://www.theatlantic.com/feed/all/"
    rationale: "Essayistic, argument-forward; high explicit-morality density."
  - id: self_vox
    name: "Vox"
    medium: news
    stratum: long_form
    role: "explainer / analysis"
    ingest:
      type: rss
      url: "https://www.vox.com/rss/index.xml"
    rationale: "Explainer framing; foregrounds care/fairness reasoning."
  - id: self_goodgood
    name: "Good Good News"
    medium: news
    stratum: long_form
    role: "solutions / constructive journalism"
    ingest:
      type: rss
      # Read in print and on the web, and ingestable as neither. As of
      # 2026-08-07 goodgood.org serves a client-rendered app with no
      # feed at /feed, /rss, /feed.xml or /sitemap.xml (all 404, as does
      # /robots.txt), so there is nothing to subscribe to and no crawl
      # policy to honour. The print edition is out of reach by
      # definition. Left null so ingestion skips it; if they publish a
      # feed, this entry is ready for the URL.
      url: null
    domain: goodgood.org
    # Recorded even though it cannot be fetched. A source that shapes
    # the diet but never reaches the corpus is a hole in the model, and
    # a hole nobody wrote down reads later as an absence of that kind of
    # coverage rather than an absence of measurement. This one is
    # load-bearing: constructive journalism is the diet's main
    # counterweight to conflict framing, and its absence pushes the
    # measured profile toward harm.
    rationale: "Solutions-first framing; the diet's counterweight to conflict-driven coverage."

  # ---------------------------------------------------------------------------
  # national_cable
  # ---------------------------------------------------------------------------
  - id: ce_foxnews_latest
    name: "Fox News — Latest"
    medium: cable
    stratum: national_cable
    role: "dominant national cable news"
    ingest:
      type: rss
      url: "https://moxie.foxnews.com/google-publisher/latest.xml"
    rationale: "Largest-reach conservative cable outlet; anchors the stratum."
  - id: ce_foxnews_opinion
    name: "Fox News — Opinion"
    medium: cable
    stratum: national_cable
    role: "cable opinion / commentary"
    ingest:
      type: rss
      url: "https://moxie.foxnews.com/google-publisher/opinion.xml"
    rationale: "Opinion desk carries more explicit foundation framing than hard news."

  # ---------------------------------------------------------------------------
  # talk_radio
  # ---------------------------------------------------------------------------
  - id: ce_dailywire_mattwalsh
    name: "The Matt Walsh Show (The Daily Wire)"
    medium: talk_radio
    stratum: talk_radio
    role: "commentary talk audio"
    ingest:
      type: podcast_rss
      # Daily Wire flagship commentary program (resolved via iTunes
      # lookup). 2215 episodes with audio enclosures; verified 2026-07-23.
      url: "https://rss.pdrl.fm/1fc256/feeds.megaphone.fm/BVDWV7762869899"
    rationale: "Representative commentary talk audio; transcribe before scoring."

  # ---------------------------------------------------------------------------
  # digital_outlets
  # ---------------------------------------------------------------------------
  - id: ce_dailywire_news
    name: "The Daily Wire — News"
    medium: news
    stratum: digital_outlets
    role: "digital conservative outlet"
    ingest:
      type: rss
      url: "https://www.dailywire.com/feeds/rss.xml"   # verified 2026-07-23 (50 items)
    rationale: "High-reach digital conservative outlet."
  - id: ce_thefp
    name: "The Free Press"
    medium: newsletter
    stratum: digital_outlets
    role: "heterodox / center-right digital"
    ingest:
      type: rss
      url: "https://www.thefp.com/feed"
    rationale: "Adds internal diversity; heterodox rather than movement-aligned."

  # ---------------------------------------------------------------------------
  # faith_media
  # ---------------------------------------------------------------------------
  - id: ce_christianitytoday
    name: "Christianity Today"
    medium: news
    stratum: faith_media
    role: "flagship evangelical magazine"
    ingest:
      type: rss
      url: "https://www.christianitytoday.com/rss/"
    rationale: "Mainstream-evangelical framing; strong sanctity/loyalty salience."
  - id: ce_worldnews
    name: "WORLD News Group"
    medium: news
    stratum: faith_media
    role: "evangelical newsmagazine"
    ingest:
      type: rss
      # WORLD's main news feed. wng.org also publishes podcast feeds
      # (e.g. worldandeverything.xml) if audio is added later.
      url: "https://wng.org/feeds/rss/topics.rss"   # verified 2026-07-23
    rationale: "Explicitly Christian-worldview reporting; complements CT."

  # ---------------------------------------------------------------------------
  # podcasts
  # Feed URLs verified live 2026-08-07 (HTTP 200, audio enclosures present).
  # ---------------------------------------------------------------------------
  - id: self_npr_upfirst
    name: "Up First (NPR)"
    medium: podcast
    stratum: podcasts
    role: "daily public-radio news briefing"
    ingest:
      type: podcast_rss
      # 500 episodes with audio enclosures; verified 2026-08-07.
      url: "https://feeds.npr.org/510318/podcast.xml"
    rationale: "Daily national briefing; the audio counterpart to the NPR desks above."
  - id: self_pbs_newshour_show
    name: "PBS News Hour — Full Show"
    medium: podcast
    stratum: podcasts
    role: "public-television nightly news"
    ingest:
      type: podcast_rss
      # Resolved via iTunes lookup; 29 episodes live in the feed at a
      # time, with audio enclosures. Verified 2026-08-07.
      url: "https://www.pbs.org/newshour/feeds/rss/podcasts/show"
    # Same newsroom as `self_pbs_newshour` above, in a different medium.
    # Deliberate — a broadcast segment and a web headline frame the same
    # story differently — but it does double-count PBS at the outlet
    # level, and transcript text is unlikely to dedup against article
    # text. Drop one of the two if PBS starts dominating the profile.
    rationale: "Broadcast framing of the day's stories; overlaps the PBS RSS feed by design."
  - id: self_nyt_daily
    name: "The Daily (The New York Times)"
    medium: podcast
    stratum: podcasts
    role: "daily news narrative"
    ingest:
      type: podcast_rss
      # 2939 episodes with audio enclosures; verified 2026-08-07.
      url: "https://feeds.simplecast.com/54nAGcIl"
    rationale: "One story told at length; more explicit moral framing than the same paper's copy."
  - id: self_radio_atlantic
    name: "Radio Atlantic (The Atlantic)"
    medium: podcast
    stratum: podcasts
    role: "long-form magazine audio"
    ingest:
      type: podcast_rss
      # 377 episodes with audio enclosures; verified 2026-08-07.
      url: "https://feeds.megaphone.fm/radioatlantic"
    rationale: "Audio arm of a magazine already in the diet; argument-forward, high moral density."
  - id: self_economist_intelligence
    name: "The Intelligence (The Economist)"
    medium: podcast
    stratum: podcasts
    role: "international daily analysis"
    ingest:
      type: podcast_rss
      # 1990 episodes with audio enclosures; verified 2026-08-07.
      url: "https://access.acast.com/rss/d556eb54-6160-4c85-95f4-47d9f5216c49"
    rationale: "Non-US vantage and a market-liberal frame absent elsewhere in this diet."
    terms: >
      Some Economist episodes are subscriber-gated; the public feed can
      carry a trailer where a full episode is expected. Check what
      actually transcribes before trusting the weight.
  - id: self_jacobin_radio
    name: "Jacobin Radio"
    medium: podcast
    stratum: podcasts
    role: "socialist-left commentary"
    ingest:
      type: podcast_rss
      # 1887 episodes with audio enclosures; verified 2026-08-07.
      url: "https://pinecast.com/feed/jacobin"
    rationale: "Left-of-liberal frame; the diet's only source arguing from outside the liberal consensus."
  - id: self_makingsense_harris
    name: "Making Sense with Sam Harris"
    medium: podcast
    stratum: podcasts
    role: "long-form interview / secular commentary"
    ingest:
      type: podcast_rss
      # A Making Sense subscription comes with a per-account feed
      # (samharris.org/subscriber-rss/?id=...). The token in that URL is
      # the credential, and Sam Harris's own help pages say not to share
      # it, so it is named here and stored in the environment — never
      # written into this file. Put the value in Bitwarden Secrets
      # Manager and let scripts/parallax-daily.sh export it.
      url_env: PARALLAX_FEED_MAKINGSENSE
      # Fallback for anyone without the subscription: the public feed,
      # 502 items, verified 2026-08-07.
      url: "https://rss.libsyn.com/shows/94577/destinations/480596.xml"
    rationale: "Past rather than current listening; weighted to match."
    terms: >
      The public feed carries partial episodes — full audio is behind a
      subscription. Transcripts will be truncated, which biases any
      score toward the opening framing of an episode. Setting
      PARALLAX_FEED_MAKINGSENSE to the subscriber feed removes that
      bias; the subscriber URL is personal and must not be committed or
      shared.
  - id: ce_relatable_stuckey
    name: "Relatable with Allie Beth Stuckey"
    medium: podcast
    stratum: podcasts
    role: "long-form evangelical commentary"
    ingest:
      type: podcast_rss
      # Resolved from Apple Podcasts id 1359249098 via iTunes lookup.
      # 1445 episodes with audio enclosures; verified 2026-07-23.
      url: "https://feeds.megaphone.fm/BMDC9964487814"
    rationale: "Explicitly evangelical long-form commentary; transcribe before scoring."

