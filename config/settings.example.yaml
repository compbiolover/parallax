# =============================================================================
# Parallax settings — EXAMPLE
# =============================================================================
# Copy to config/settings.yaml (gitignored) and adjust. Secrets do NOT live
# here — put API keys in .env (see .env.example). This file holds
# non-secret operational configuration only.
# =============================================================================

# --- Source registry -------------------------------------------------------
sources:
  # The public, committed model: the source catalog and the documented personas.
  registry: config/sources.yaml
  # YOUR OWN diet, merged over the file above. Keep it out of the public registry:
  # that one holds documented *models* of media environments, while this one
  # describes a real person's real consumption — which CLAUDE.md §0 says Parallax
  # does not collect and does not publish. It is gitignored, and absent by
  # default, the same way config/settings.yaml is absent until you copy this file.
  #
  # Same shape as sources.yaml (`strata`, `catalog`, `personas`); entries are
  # merged by id, so a persona or source you define with an existing id replaces
  # the public one wholesale and a new id is appended. Then point the reference
  # pair below at your persona.
  local_registry: config/personas.local.yaml

# --- Datastore -------------------------------------------------------------
# MVP: SQLite on local disk. Move to Postgres + pgvector when co-locating
# embeddings becomes worthwhile.
datastore:
  kind: sqlite                    # sqlite | postgres
  # Relative paths resolve against the repository root, not the working
  # directory, so the scheduled run — which inherits no cwd — opens the same
  # file you do. Pass an absolute path, or `--db`, to put it elsewhere.
  path: data/parallax.sqlite      # gitignored
  # postgres_dsn: env:PARALLAX_POSTGRES_DSN   # resolved from .env when kind=postgres
  rollups_dir: data/rollups       # daily Parquet rollups for cheap aggregation

# --- Ingestion -------------------------------------------------------------
ingestion:
  # Which personas' sources to fetch: `all` (the default) or a list of persona ids.
  #
  # Adding a persona is free — it is a weighting over sources already in the
  # catalog, so nothing extra is fetched, scored, embedded or tagged. Adding the
  # *sources* a new persona needs is not free: they cost ingestion time, GDELT
  # backfill time (one query per domain at ~1 request/5s), and liberty-tagger
  # spend, all per document. The shipped library needs roughly four times the
  # catalog two diets did.
  #
  # Narrowing this is not free either: a persona whose sources are never fetched
  # has an empty profile and renders as a blank column. `all` is the honest
  # default; this is here for someone who has looked at the bill.
  personas: all
  user_agent: "parallax-research-bot/0.1 (+https://github.com/compbiolover/parallax)"
  respect_robots_txt: true
  request_timeout_seconds: 30
  rate_limit:
    per_host_requests_per_minute: 20
  extraction:
    primary: trafilatura
    fallback: goose3
  # Podcasts and talk radio: RSS enclosure -> faster-whisper -> transcript,
  # scored exactly like an article. Needs parallax[media]; without it the step
  # logs the reason once and does nothing, the same way the transformer tagger
  # behaves. Run it by hand first (`make podcasts`) — an hour of audio takes
  # roughly an hour of CPU at `medium`/int8, and you want to know what that
  # costs on your machine before a 6am job depends on the answer.
  audio:
    whisper_model: medium         # large-v3 for accuracy, medium for speed
    compute_type: int8            # int8 on CPU for overnight batch
    device: auto                  # auto | cpu | cuda
    filter_silence: true          # Whisper hallucinates on long silences
    # Budgets. Each of these exists because this is the one step that can run
    # for hours, and the daily job has a brief to deliver in the morning.
    max_episodes_per_source: 3    # per run; most shows publish daily
    since_days: 7                 # ignore the back catalogue on a first run
    time_budget_seconds: 10800    # 3h; checked between episodes, never inside one
    max_megabytes: 500            # an enclosure bigger than this is a mistake
  youtube:
    prefer_captions: true         # youtube-transcript-api first, yt-dlp fallback

# --- Dedup -----------------------------------------------------------------
dedup:
  exact: content_hash
  near_duplicate:
    method: minhash               # minhash | embedding_cosine
    minhash_threshold: 0.85
    embedding_cosine_threshold: 0.92

# --- Scoring ---------------------------------------------------------------
scoring:
  length_normalize: true          # REQUIRED — never disable (see LIMITATIONS.md)
  taggers:
    dictionary:
      enabled: true
      library: eMFDscore
      # Path to an eMFD-format CSV (columns: word, <foundation>_p, <foundation>_sent).
      # Unset -> the built-in demo seed lexicon (illustrative only). Point this at
      # the real eMFD for trustworthy scores. Keep the file outside git (data/ is
      # gitignored). Get it from the eMFDscore repo: dictionaries/emfd_scoring.csv.
      lexicon_path: data/emfd_scoring.csv
      # How a word's foundation weights aggregate:
      #   argmax      - assign each word to its dominant foundation (default;
      #                 required for the eMFD, whose per-word probabilities span
      #                 all five foundations and otherwise wash out to base rates)
      #   probability - sum raw per-foundation probabilities (base-rate dominated)
      assignment: argmax
      # Partition `fairness` into equality vs proportionality (MFQ-2, Atari &
      # Haidt 2023). No validated dictionary implements this split, so it runs
      # off a hand-built term list in scoring/fairness_split.py — treat it as an
      # exploratory refinement, not an instrument. It never alters the five
      # classic foundation scores; it only divides the fairness one.
      # `fairness_min_evidence` is how many split-terms a document must contain
      # before it is partitioned at all; below that it stays unsplit (recorded
      # as NULL, which is deliberately not the same as an even split). Raise it
      # for firmer partitions over fewer documents.
      split_fairness: true
      fairness_min_evidence: 2
    transformer:
      # Run the Mformer transformer tagger on every article at ingestion (in
      # addition to the dictionary), so the dashboard can show a
      # dictionary-vs-transformer confidence band per foundation. Needs
      # parallax[scoring] (torch + transformers) and downloads ~5 RoBERTa models
      # on first use; when the deps are missing the pipeline logs once and falls
      # back to dictionary-only (no band). Override per-run with
      # `--transformer/--no-transformer`.
      enabled: true
      model: mformer              # 'mformer' alias, or a literal HF model prefix
      # revision: <commit-or-tag> # pin the HF revision (recommended for reproducibility)
      max_length: 256
    liberty:
      # Liberty/oppression via Claude — the sixth foundation, and the only one
      # nothing else here can score: the eMFD and MFD cover five, and Mformer's
      # training corpus does not label liberty either.
      #
      # This is the one tagger that costs money per document. It runs only when
      # ANTHROPIC_API_KEY is set; without a key the run completes with five
      # foundations rather than failing. `batch` uses the Batch API (half price;
      # the daily job is an overnight batch by design). `effort: low` matters —
      # Sonnet 5 runs adaptive thinking at `high` effort by default, which bills
      # several times the output tokens for judgment against a fixed rubric.
      #
      # Cost sketch at ~200 documents/day: roughly $17/month on Sonnet 5 with
      # batching, ~$8 on Haiku 4.5, ~$42 on Opus 5. Compare tiers empirically
      # before committing: `python3 -m validation --scorer liberty --model X --limit 40`.
      enabled: true
      model: claude-sonnet-5
      effort: low                 # low | medium | high | xhigh | max
      batch: true                 # Batch API: 50% cheaper, completes within the hour
  ensemble:
    low_confidence_on_disagreement: true
  split_fairness: false           # equality vs proportionality (Atari & Haidt 2023)

# --- Clustering / blindspot engine (Phase 2) -------------------------------
cluster:
  embedder:
    kind: hashing                 # hashing (built-in, no deps) | sentence-transformers
    dim: 512                      # hashing dimensionality
    # sentence-transformers model (used when kind: sentence-transformers).
    # Benchmarked on 396 stories / 151 same-story pairs (see LIMITATIONS.md):
    # thenlper/gte-small (best simple choice, no prefix) ~ BAAI/bge-small-en-v1.5
    # (needs query_prefix) > all-MiniLM-L6-v2 > all-mpnet-base-v2. Bigger != better.
    model: thenlper/gte-small
    # Pin a Hugging Face revision (commit hash or tag) for reproducibility and
    # supply-chain safety — the model is downloaded from the hub. Unset = latest.
    # (Weights load without trust_remote_code, so a model can't run bundled code.)
    revision:
    # Instruction prefix prepended to every text. Required by instruction-tuned
    # families to score well; leave empty for gte/MiniLM/mpnet.
    #   bge: "Represent this sentence for searching relevant passages: "
    #   e5:  "query: "
    query_prefix: ""
  hdbscan:
    min_cluster_size: 2           # small news samples over-assign to noise at higher values
  blindspot:
    coverage_asymmetry_threshold: 0.75  # one diet's share of a cluster to call it a blindspot
  # A cluster is the unit blindspots are *measured* on — two to five stories,
  # a couple of dozen a day. A theme is the unit they are *read* on: clusters
  # grouped by subject and direction, under a name written for a person
  # ("Faith & the church"), which is what the dashboard and the email show.
  #
  # Claude names and groups them in one call per cluster run — much better than
  # keywords on subjects the taxonomy has never heard of. Without a key (or with
  # `claude: false`) the built-in taxonomy in cluster/themes.py does it instead,
  # which is deterministic, free, and always available; it is also the per-cluster
  # fallback whenever Claude declines to place one.
  themes:
    claude: true
    model: claude-sonnet-5
    # Thinking depth: low | medium | high | xhigh | max. `low` for the same
    # reason liberty uses it — placing a headline in a fixed vocabulary does not
    # get better for the extra output tokens a deeper think bills.
    #
    # It is also the difference between this step working and not. `max_tokens`
    # here scales with the number of stories and caps thinking and the JSON
    # together, and thinking expands to fill whatever it is given: measured on a
    # 717-story day, `medium` spent the entire allowance reasoning and returned
    # no JSON at all, twice in two tries, while `low` returned the full batch.
    # Raising the budget does not buy a way out of that. Raise the effort only
    # if theme titles read thin, and check `data/daily.log` for "Claude theming
    # failed" afterwards.
    effort: low

# --- Comparison ------------------------------------------------------------
compare:
  # THE PAIR every headline number is about: the JSD, the per-foundation
  # log-ratios, the agenda divergence, the blindspots, the email, and the dated
  # snapshot series. Other personas stay in the payload and stay selectable in
  # the dashboard; these two are what the numbers describe.
  #
  # `mine` first is not cosmetic. It fixes the log-ratio sign to "positive = my
  # diet over-indexes" (CLAUDE.md §3(5)), and it lets every surface colour by
  # role in the comparison rather than by position in a list.
  #
  # CHANGING THIS BREAKS THE SERIES. Every snapshot already recorded compares
  # `self` with `modeled_ce`; the column keeps its name across a change but stops
  # meaning the same thing, so the run warns and the chart marks the break.
  reference_pair:
    mine: self
    theirs: modeled_ce
  headline_metric: jensenshannon  # base-2, squared to divergence, bounded [0,1]
  also_report:
    - log_ratio                   # ln(P_i / Q_i); index form 100 = parity
    - aitchison_clr               # compositionally correct Euclidean distance
    - cosine                      # sanity check
    - smoothed_kl                 # sanity check (add epsilon first)
  zero_replacement_epsilon: 1.0e-6

# --- Summarization ---------------------------------------------------------
summarize:
  model: claude-opus-5
  # Which personas get written prose: `pair` (the reference pair, the default),
  # `all`, or an explicit list of ids. This is a reliability knob as much as a
  # cost one — one call carries every persona's headlines in its prompt and every
  # persona's section in its reply, under a max_tokens that covers thinking and
  # prose together. Eight personas is a much better chance of the empty-prose
  # failure the summarizer already guards against.
  personas: pair
  # Thinking depth: low | medium | high | xhigh | max. Opus 5 thinks by default
  # and `max_tokens` caps thinking *and* the prose together, so effort is the
  # lever for cost and latency here. `low` is the default — this is a bounded
  # writing task over numbers that are already computed, and the daily run pays
  # for it every morning.
  #
  # Raising this is not free in reliability. Measured on the live corpus, this
  # step at `medium` thought for ~1000 tokens and then ended its turn with no
  # prose at all in 3 of 4 calls, which silently drops the brief to the
  # numbers-only fallback; `low` wrote it 5 times out of 5. The summarizer
  # retries once, so a raise degrades gradually rather than all at once — but
  # check `data/daily.log` for "no summary text" if you raise it.
  effort: low
  require_verbatim_quotes: true   # every summary auditable against source
  steelman_each_side: true

# --- Output ----------------------------------------------------------------
output:
  dashboard_data_dir: dashboard/public/data   # generated JSON for the static site
  show_confidence_bands: true

# --- Daily snapshot (`make daily` / `python3 -m daily`) ----------------------
# One command runs: ingest -> backfill -> cluster -> summarize -> export.
# Steps are isolated: if one fails the rest still run, so the dashboard is
# refreshed from whatever data landed, and the CLI exits non-zero for cron.
daily:
  # GDELT backfill is included by default — blindspots are only trustworthy
  # with real per-outlet volume behind them. It is also the slow part (the free
  # endpoint throttles to ~1 request/5s), so a full-registry run takes a while.
  # Shorten the window for a cheaper daily cadence; dedup makes re-runs
  # idempotent, so overlapping windows cost time, not correctness.
  backfill:
    enabled: true
    days: 14
    max_per_source: 250
    extract_bodies: false         # fetch article bodies too (much slower)
    transformer: false            # title-only bulk; bands come from feed ingest

  # Each run records one dated snapshot (one row per UTC date — same-day re-runs
  # replace it). `window_days` is the trailing window behind the responsive
  # series; the all-time series is always recorded alongside it. `history_limit`
  # caps how many recent snapshots get serialized into the dashboard payload.
  snapshot:
    window_days: 7
    history_limit: 365

# --- Daily email brief (`python3 -m digest`) ---------------------------------
# The dashboard rendered into a self-contained email, so the brief arrives on
# its own and nothing about your media diet is published to a public URL.
#
# Off by default: sending needs SMTP credentials (see .env.example), and a step
# that fails every morning until configured teaches you to ignore the report
# that is supposed to tell you when something actually broke.
#
# Preview it without any of that:  python3 -m digest --dry-run --open
digest:
  enabled: false
  # Which diet is yours. Your own blindspots lead the email — equal styling is
  # not equal prominence on a phone, where second means scrolled past.
  #
  # Defaults to `compare.reference_pair.mine`; set it only to override that. The
  # email always compares the reference pair and no more: it has no picker, and a
  # phone-length brief that tried to cover ten personas is one nobody finishes.
  own_diet: self
